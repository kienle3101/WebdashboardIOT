spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: SmartHouse
  datasource:
    url: jdbc:sqlserver://localhost:1434;databaseName=smart_house_db;encrypt=false;trustServerCertificate=true
    username: MSI
    password: 1234
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      data-source-properties:
        sendStringParametersAsUnicode: true
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: false

server:
  port: 8080
  servlet:
    context-path: /api/v1/smartHouse
serial:
  port: COM2
  baud-rate: 9600

jwt:
  singerKey: "PC8kxKGhdSmTjsgrnxy6r4qamn8fmrtkexw9EQCa02A="
  valid-duration: 3600 # in second
  refreshable-duration: 360000 # in second